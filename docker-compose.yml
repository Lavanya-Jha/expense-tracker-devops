services:
  # 1. The Database
  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: supersecretroot
      MYSQL_DATABASE: expenses
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql

  # 2. The API
  api:
    image: expense-tracker-api:latest
    ports:
      - "8080:8080"
    environment:
      # These force Spring Boot to use EXACTLY these values!
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/expenses
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: supersecretroot
    depends_on:
      - mysql-db

volumes:
  db-data: